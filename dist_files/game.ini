; Zelda's Adventure (CD-i recompilation): settings for this copy of the game.
; The game keeps everything it writes (saves, quicksaves, settings) in this folder.
[game]
; your disc image: the .cue or .bin file, or the folder that contains it
rom=
; look for a newer version when the game starts (0 = never)
check_updates=1
; install a newer version without asking first (1 = yes)
auto_update=0
